; ============================================================================
; Asterisk REST Interface (ARI) configuration
; ============================================================================
; Goes on your VPS at /etc/asterisk/ari.conf. This is what telephony/
; ariClient.js (the Node call-routing service) authenticates against —
; set ASTERISK_ARI_USER / ASTERISK_ARI_PASSWORD in your .env to match
; whatever you put here (don't reuse this literal example password).

[general]
enabled=yes
pretty=yes

[callcenter]
type=user
read_only=no
password=CHANGE_ME_TO_A_REAL_SECRET
