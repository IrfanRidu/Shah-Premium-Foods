; ============================================================================
; Asterisk dialplan
; ============================================================================
; Goes on your VPS at /etc/asterisk/extensions.conf (or included from
; it). Deliberately routes ALL inbound-call decision-making (which agent
; to ring, timeout/retry, queueing, hold music, connecting the oldest
; waiter) into the Node ARI service (telephony/ariClient.js in this
; module) via Stasis(), rather than Asterisk's older app_queue — that
; gives the CRM full programmatic control matching the spec's exact
; routing rules, instead of fighting queues.conf's more rigid model.

[from-trunk]
; Replace "your-trunk-name" with whatever your SIP trunk / PSTN
; provider's context actually is — this is deliberately a placeholder,
; not a guess at a specific provider, since that varies per deployment.
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(callcenter-app,inbound)
 same => n,Hangup()

[agents-outbound]
; An agent's WebRTC softphone dials sip:<number>@<your-domain> (see
; sipClient.js's makeCall()) — this context takes it from there and
; sends it out to the PSTN via your trunk. Also routes it through
; Stasis first so the SAME Node service logs/tracks outbound calls
; consistently with inbound ones (recording, CallLog sync, etc.)
exten => _X.,1,NoOp(Agent ${CALLERID(num)} calling ${EXTEN})
 same => n,Stasis(callcenter-app,outbound,${EXTEN})
 same => n,Hangup()

[callcenter-internal]
; Used by the ARI service (ariClient.js) when it originates a leg to
; ring a specific agent — see appArgs="agent-leg" in that file.
exten => _agent-.,1,NoOp(Ringing agent leg ${EXTEN})
 same => n,Stasis(callcenter-app,agent-leg)
 same => n,Hangup()
