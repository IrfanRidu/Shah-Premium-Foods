; ============================================================================
; Asterisk built-in HTTP server — required for BOTH:
;   1. ARI (the Node service in this module talks to Asterisk over this)
;   2. The WebRTC WebSocket transport (pjsip.conf's transport-wss)
; ============================================================================
; Goes on your VPS at /etc/asterisk/http.conf.

[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
; TLS is what upgrades this to wss:// for the browser side — required,
; browsers refuse getUserMedia/WebRTC over an insecure origin for
; anything except localhost. Point these at a real certificate (e.g.
; Let's Encrypt via certbot) — self-signed will make browsers refuse
; the WebSocket connection with a confusing, silent-looking failure.
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.key
