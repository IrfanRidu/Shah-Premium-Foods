; ============================================================================
; Asterisk PJSIP configuration — WebRTC transport + agent endpoints
; ============================================================================
; Goes on your VPS at /etc/asterisk/pjsip.conf (or included from it).
; Written for Asterisk 20 LTS. HONESTY NOTE: written correctly against
; Asterisk's documented config syntax, but not exercised against a real
; running Asterisk instance — this sandbox has no telephony
; infrastructure to test against. Validate with `asterisk -rx "pjsip
; show endpoints"` after loading on your actual VPS.

; --- Global settings ---
[global]
type=global
; Historic default is "compat", but WebRTC clients (SIP.js) need the
; full RFC 3261 endpoint identifier lookup or some registrations can
; misbehave behind the browser's own SDP quirks.
endpoint_identifier_order=username,ip

; --- WebSocket transport (this is what makes WebRTC possible) ---
; Requires http.conf's TLS block enabled (see http.conf in this same
; folder) since browsers require wss:// (secure WebSocket), not ws://,
; for getUserMedia/WebRTC to be allowed to run at all on any origin
; other than localhost.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; --- Agent endpoint TEMPLATE ---
; Every agent gets their own endpoint/aor/auth trio, following this
; exact shape. These are NOT hand-written per agent — see
; generatePjsipConfig.js in this same folder, which queries MongoDB for
; every Employee with isCallCenterAgent:true and generates
; pjsip_agents.conf (included below) automatically, using the
; sipUsername/sipPassword already generated at agent-creation time
; (src/server/controllers/callCenterAgent.controller.js). Re-run that
; script (or wire it into your agent-creation flow directly) whenever
; agents are added/removed, then `asterisk -rx "pjsip reload"` — no
; Asterisk restart needed.
;
; [agent-<sipUsername>]
; type=endpoint
; transport=transport-wss
; context=agents-outbound        ; which dialplan context this endpoint's calls enter
; disallow=all
; allow=opus,ulaw,alaw            ; opus first: WebRTC's native codec, no transcoding needed
; webrtc=yes                      ; shorthand that also sets dtls/ice/rtcp_mux below
; dtls_auto_generate_cert=yes     ; fine for internal use; swap for a real cert in production
; use_avpf=yes
; media_encryption=dtls
; ice_support=yes
; rtcp_mux=yes
; auth=agent-<sipUsername>-auth
; aors=agent-<sipUsername>-aor
; callerid=<agent name> <sipUsername>
;
; [agent-<sipUsername>-auth]
; type=auth
; auth_type=userpass
; username=<sipUsername>
; password=<sipPassword>          ; from Employee.sipPassword — see the
;                                  ; security note on that field in
;                                  ; employee.model.js re: encryption at rest
;
; [agent-<sipUsername>-aor]
; type=aor
; max_contacts=1                  ; one browser tab registered at a time per agent
; remove_existing=yes             ; a new tab registering kicks out a stale one, rather than colliding

#include pjsip_agents.conf
