; ============================================================================
; Asterisk RTP (media) configuration
; ============================================================================
; Goes on your VPS at /etc/asterisk/rtp.conf. Open this exact UDP range
; in your VPS firewall/security-group rules, or agents will connect but
; hear silence (signaling succeeds over the WebSocket, but the actual
; audio packets have nowhere to go) — this is one of the single most
; common WebRTC-to-Asterisk setup failures, worth double-checking first
; if calls connect but stay silent.
[general]
rtpstart=10000
rtpend=20000

icesupport=yes
; If your VPS is NATed (most cloud VPS providers put you behind at
; least one layer of NAT even with a "public" IP), you need a STUN
; server so ICE can discover your real public address — a small,
; self-hosted coturn instance works well and keeps this "no paid
; third-party services" as requested; a public STUN server (e.g.
; stun.l.google.com:19302) also works for STUN specifically (TURN,
; which relays media through a relay server for the hardest NAT cases,
; is the part worth self-hosting if you hit issues — see
; telephony/README.md's NAT/coturn section).
stunaddr=stun.l.google.com:19302
